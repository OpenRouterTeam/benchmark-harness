# Generated by taskgen. world = mock APIs + grader; tools = every MCP server.
services:
  main:
    depends_on:
      tools:
        condition: service_healthy
  world:
    image: tool-bench-world:dev
    environment:
      SCENARIO_ID: "business/multi/zendesk-order-status-shopify"
    networks:
      default:
        aliases:
          - api.datadoghq.com
          - api.exa.ai
          - api.github.com
          - api.search.brave.com
          - api.tavily.com
          - github.octo-corp.com
          - octo-corp.myshopify.com
          - octo-corp.okta.com
          - registry.terraform.io
          - servicereference.us-east-1.amazonaws.com
          - xguihxuzqibwxjnimxev.supabase.co
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:9000/_bench/health"]
      interval: 1s
      timeout: 3s
      retries: 60
  tools:
    image: tool-bench-tools:dev
    depends_on:
      world:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-s", "-o", "/dev/null", "http://localhost:7132/mcp"]
      interval: 1s
      timeout: 3s
      retries: 120
