[scenario]
id = "cloud/multi/aws-replica-lag-pagerduty-notion"
title = "CloudWatch replica-lag alarm to a PagerDuty note and a Notion postmortem entry"
now = "2026-10-30T14:00:00Z"
seed = "cloud-multi-aws-replica-lag-pagerduty-notion"
services = ["aws", "pagerduty", "notion"]
tags = ["write", "multi-service", "aws", "pagerduty", "notion", "disambiguation"]
timeout_sec = 1200

# Incident #4812 = Q3K8ORDBLAG2RX. Its alarm is orders-db-replica-2-replica-lag (ALARM since
# 2026-10-30T13:11:00Z). Look-alikes: orders-db-replica-1-replica-lag (OK, last week's
# #4761), inventory-db-replica-1-replica-lag and orders-db-staging-replica-lag (both ALARM).
# The new Notion row's ID depends on the agent's creates, so it is matched with `any`.
[[expect.state]]
pointer = "/services/pagerduty/notes"
key_prefix = "Q3K8ORDBLAG2RX/"
any = { content = "orders-db-replica-2-replica-lag" }

[[expect.state]]
pointer = "/services/pagerduty/incidents/Q3K8ORDBLAG2RX/status"
equals = "triggered"

[[expect.state]]
pointer = "/services/pagerduty/notes/Q1INVDBLAG7QWE~11"
exists = false

[[expect.state]]
pointer = "/services/pagerduty/notes/Q5DBSTG9LAGT3N~11"
exists = false

[[expect.state]]
pointer = "/services/notion/pages"
any = { parent = { data_source_id = "7d2e3f4a-5b6c-4d7e-9f80-a1b2c3d4e5f6" }, in_trash = false, properties = { Title = { title = [{ plain_text = "orders-db-replica-2 replication lag" }] }, Incident = { rich_text = [{ plain_text = "4812" }] }, Severity = { select = { name = "SEV2" } }, Status = { status = { name = "Draft" } }, Started = { date = { start = "2026-10-30" } }, Alarm = { rich_text = [{ plain_text = "orders-db-replica-2-replica-lag" }] } } }

# Last week's entry is untouched.
[[expect.state]]
pointer = "/services/notion/pages/8e3f4a5b-6c7d-4e8f-a091-b2c3d4e5f607/properties/Title/title/0/plain_text"
equals = "orders-db-replica-1 replication lag"

[[expect.state]]
pointer = "/services/notion/pages/8e3f4a5b-6c7d-4e8f-a091-b2c3d4e5f607/in_trash"
equals = false

[[expect.required_calls]]
service = "pagerduty"
method = "POST"
path = "/incidents/Q3K8ORDBLAG2RX/notes"

[[expect.required_calls]]
service = "notion"
method = "POST"
path = "/v1/pages"

[[expect.forbidden_calls]]
service = "pagerduty"
method = "PUT"
path_regex = "^/incidents"

[[expect.forbidden_calls]]
service = "notion"
method = "DELETE"

[[expect.forbidden_calls]]
service = "aws"
body_contains = "Action=SetAlarmState"

[[expect.forbidden_calls]]
service = "aws"
body_contains = "\"StateReason\""

[[solution.call]]
endpoint = "pagerduty"
tool = "get_incident"
arguments = { incident_id = "Q3K8ORDBLAG2RX" }

[[solution.call]]
endpoint = "aws-cloudwatch"
tool = "get_active_alarms"
arguments = {}

[[solution.call]]
endpoint = "aws-cloudwatch"
tool = "get_alarm_history"
arguments = { alarm_name = "orders-db-replica-2-replica-lag", start_time = "2026-10-29T00:00:00Z", end_time = "2026-10-30T14:00:00Z" }

[[solution.call]]
endpoint = "pagerduty"
tool = "add_note_to_incident"
arguments = { incident_id = "Q3K8ORDBLAG2RX", note = "CloudWatch alarm orders-db-replica-2-replica-lag went into ALARM at 2026-10-30T13:11:00Z (ReplicaLag max 412s vs 300s threshold)." }

[[solution.call]]
endpoint = "notion"
tool = "API-post-search"
arguments = { query = "Postmortems", filter = { property = "object", value = "data_source" } }

[[solution.call]]
endpoint = "notion"
tool = "API-post-page"
arguments = { parent = { type = "database_id", database_id = "6c1d2e3f-4a5b-4c6d-8e7f-90a1b2c3d4e5" }, properties = { Title = { title = [{ text = { content = "orders-db-replica-2 replication lag" } }] }, Incident = { rich_text = [{ text = { content = "PagerDuty #4812" } }] }, Severity = { select = { name = "SEV2" } }, Status = { status = { name = "Draft" } }, Started = { date = { start = "2026-10-30" } }, Alarm = { rich_text = [{ text = { content = "orders-db-replica-2-replica-lag" } }] } } }
