[scenario]
id = "cloud/multi/supabase-slack-referral-signups"
title = "Answer a Slack question about referral sign-ups from the production Supabase database"
now = "2026-10-29T15:00:00Z"
seed = "cloud-multi-supabase-slack-referral-signups"
services = ["supabase", "slack"]
tags = ["lookup", "multi-service", "supabase", "slack", "disambiguation"]
timeout_sec = 1200

# storefront-prod customers with referral_code FALL26, minus @octo-shop.com QA accounts:
# 1201, 1202, 1205, 1207 = 4. Their non-cancelled orders: 120.00 + 80.50 + 210.00 = 410.50
# (5103 is cancelled). Traps: QA accounts 1203/1208 (999.00 and 450.00 orders), the FALL25
# code (1198, 1204), and six FALL26 load-test sign-ups in storefront-staging.
[expect.answer]
contains = ["410.5"]
regex = '(?i)(\b4\s+(new\s+)?(customers|signups|sign-ups|users|people|referr)|(customers|signups|sign-ups|sign ups|users|people)[^0-9\n]{0,40}\b4\b)'

[[expect.forbidden_calls]]
service = "slack"
path = "/_mcp/tools/call"
body = { name = "slack_send_message" }

[[expect.forbidden_calls]]
service = "supabase"
path = "/_mcp/tools/call"
body = { name = "apply_migration" }

[[expect.forbidden_calls]]
service = "supabase"
body_contains = "update public."

[[expect.forbidden_calls]]
service = "supabase"
body_contains = "delete from"

[[solution.call]]
endpoint = "slack"
tool = "slack_search_channels"
arguments = { keywords = ["growth"], natural_language_query = "growth channel" }

[[solution.call]]
endpoint = "slack"
tool = "slack_read_thread"
arguments = { channel_id = "C0GROWTH7LF", message_ts = "1793283000.002100" }

[[solution.call]]
endpoint = "supabase"
tool = "list_projects"
arguments = {}

[[solution.call]]
endpoint = "supabase"
tool = "execute_sql"
arguments = { project_id = "qmvbxtzkplrnwdhyfaco", query = "select count(*) as customers from public.customers where referral_code = 'FALL26' and email not like '%@octo-shop.com'" }

[[solution.call]]
endpoint = "supabase"
tool = "execute_sql"
arguments = { project_id = "qmvbxtzkplrnwdhyfaco", query = "select sum(o.total) as spend from public.orders o join public.customers c on c.id = o.customer_id where c.referral_code = 'FALL26' and c.email not like '%@octo-shop.com' and o.status <> 'cancelled'" }

[solution]
answer = "FALL26 referral campaign (production storefront, excluding @octo-shop.com QA accounts): 4 customers have signed up with the code, and they have spent $410.50 in total (cancelled orders excluded).\n"
