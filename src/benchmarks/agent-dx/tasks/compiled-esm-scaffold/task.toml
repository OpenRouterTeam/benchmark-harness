schema_version = "1.0"

[task]
name = "agent-dx/compiled-esm-scaffold"
description = "Regression: scaffold a compiled TypeScript OpenRouter integration whose entry module uses top-level await — observed failure mode is choosing a CommonJS output format that cannot compile top-level await."
keywords = ["openrouter", "typescript", "esm", "top-level-await", "regression"]
suite = "regression"

[metadata]
difficulty = "easy"
category = "integration"

[agent]
timeout_sec = 900.0

[verifier]
timeout_sec = 600.0

[environment]
docker_image = "node:24-bookworm"
