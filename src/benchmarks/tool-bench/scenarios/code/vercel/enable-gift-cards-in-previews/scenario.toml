[scenario]
id = "code/vercel/enable-gift-cards-in-previews"
title = "Add preview/development environment variables to the storefront project"
now = "2026-10-28T15:00:00Z"
seed = "code-vercel-enable-gift-cards-in-previews"
services = ["vercel"]
tags = ["write", "single-service", "vercel"]
timeout_sec = 900

# env_by_target is the per-target view of each project's env vars (rebuilt on every change).
[[expect.state]]
pointer = "/services/vercel/env_by_target/prj_3dw2VoUa166qmaLV3P6dm828isAX/preview/NEXT_PUBLIC_ENABLE_GIFT_CARDS"
equals = "true"

[[expect.state]]
pointer = "/services/vercel/env_by_target/prj_3dw2VoUa166qmaLV3P6dm828isAX/development/NEXT_PUBLIC_ENABLE_GIFT_CARDS"
equals = "true"

[[expect.state]]
pointer = "/services/vercel/env_by_target/prj_3dw2VoUa166qmaLV3P6dm828isAX/production/NEXT_PUBLIC_ENABLE_GIFT_CARDS"
exists = false

[[expect.state]]
pointer = "/services/vercel/env_by_target/prj_3dw2VoUa166qmaLV3P6dm828isAX/preview/PAYMENTS_API_URL"
equals = "https://sandbox.pay.acme-shop.com"

[[expect.state]]
pointer = "/services/vercel/env_by_target/prj_3dw2VoUa166qmaLV3P6dm828isAX/development/PAYMENTS_API_URL"
exists = false

# Production keeps its live payments URL.
[[expect.state]]
pointer = "/services/vercel/env_by_target/prj_3dw2VoUa166qmaLV3P6dm828isAX/production/PAYMENTS_API_URL"
equals = "https://pay.acme-shop.com"

# The similarly named admin app is untouched.
[[expect.state]]
pointer = "/services/vercel/env_by_target/prj_ysFUnRJiXZGcxlQubrXGJqx7GadE/preview/NEXT_PUBLIC_ENABLE_GIFT_CARDS"
exists = false

[[expect.required_calls]]
service = "vercel"
method = "POST"
path = "/_mcp/tools/call"
body = { name = "vercel-create-environment-variables" }

[[expect.forbidden_calls]]
service = "vercel"
body = { name = "vercel-remove-environment-variable" }

[[expect.forbidden_calls]]
service = "vercel"
body = { name = "vercel-delete-project" }

[[solution.call]]
endpoint = "vercel"
tool = "vercel-create-environment-variables"
arguments = { projectId = "storefront", environmentVariables = [
  { key = "NEXT_PUBLIC_ENABLE_GIFT_CARDS", value = "true", target = ["preview", "development"], type = "plain" },
  { key = "PAYMENTS_API_URL", value = "https://sandbox.pay.acme-shop.com", target = ["preview"], type = "plain" },
] }
