[scenario]
id = "cloud/mongodb/top-category-revenue"
title = "Find February's top product category by delivered revenue"
now = "2026-03-14T09:00:00Z"
seed = "cloud-mongodb-top-category-revenue"
services = ["mongodb"]
tags = ["lookup", "single-service", "mongodb"]
timeout_sec = 900

# Delivered February orders in shop.orders: outdoor 1457.5, electronics 1309, kitchen 798,
# apparel 436. Counting cancelled/refunded/shipped orders too makes electronics win (2208);
# the stale shop_staging copy has placeholder prices.
[expect.answer]
contains = ["outdoor"]
regex = '1,?457\.5'

[[expect.forbidden_calls]]
service = "mongodb"
path = "/_mcp/tools/call"
body = { name = "update-many" }

[[expect.forbidden_calls]]
service = "mongodb"
path = "/_mcp/tools/call"
body = { name = "delete-many" }

[[solution.call]]
endpoint = "mongodb"
tool = "aggregate"
arguments = { connectionId = "preconfigured", database = "shop", collection = "orders", pipeline = [
  { "$match" = { status = "delivered", createdAt = { "$gte" = { "$date" = "2026-02-01T00:00:00.000Z" }, "$lt" = { "$date" = "2026-03-01T00:00:00.000Z" } } } },
  { "$unwind" = "$items" },
  { "$group" = { _id = "$items.category", revenue = { "$sum" = { "$multiply" = ["$items.price", "$items.qty"] } } } },
  { "$sort" = { revenue = -1 } },
] }

[solution]
answer = "Top category for delivered February 2026 orders: outdoor, with $1,457.50 in revenue.\n"
