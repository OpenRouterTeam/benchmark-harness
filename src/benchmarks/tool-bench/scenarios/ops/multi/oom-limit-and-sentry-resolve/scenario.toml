[scenario]
id = "ops/multi/oom-limit-and-sentry-resolve"
title = "Raise the OOM-killed workload's memory limit and resolve its Sentry worker-lost issue"
now = "2026-10-21T03:15:00Z"
seed = "ops-multi-oom-limit-and-sentry-resolve"
services = ["kubernetes", "sentry"]
tags = ["write", "multi-service", "kubernetes", "sentry", "disambiguation"]
timeout_sec = 900

# Kubernetes: analytics/report-builder pods are OOMKilled (512Mi limit). report-api,
# report-scheduler (one old exit-1 restart) and analytics-staging/report-builder stay as-is.
# Sentry: REPORT-BUILDER-4T is the SIGKILL WorkerLostError. Look-alikes: BILLING-EXPORTER-2D
# (identical title, other project) and REPORT-BUILDER-4Q (another unresolved error, same project).
[[expect.state]]
pointer = "/services/kubernetes/deployments.apps/analytics~1report-builder/spec/template/spec/containers/0/resources/limits/memory"
equals = "1Gi"

[[expect.state]]
pointer = "/services/kubernetes/deployments.apps/analytics~1report-builder/spec/template/spec/containers/0/image"
equals = "ghcr.io/lumen-labs/report-builder:3.2.0"

[[expect.state]]
pointer = "/services/kubernetes/deployments.apps/analytics~1report-builder/spec/replicas"
equals = 2

[[expect.state]]
pointer = "/services/kubernetes/deployments.apps/analytics~1report-api/spec/template/spec/containers/0/resources/limits/memory"
equals = "512Mi"

[[expect.state]]
pointer = "/services/kubernetes/deployments.apps/analytics-staging~1report-builder/spec/template/spec/containers/0/resources/limits/memory"
equals = "512Mi"

[[expect.state]]
pointer = "/services/sentry/issues/REPORT-BUILDER-4T/status"
equals = "resolved"

[[expect.state]]
pointer = "/services/sentry/issues/BILLING-EXPORTER-2D/status"
equals = "unresolved"

[[expect.state]]
pointer = "/services/sentry/issues/REPORT-BUILDER-4Q/status"
equals = "unresolved"

[[expect.required_calls]]
service = "kubernetes"
path = "/apis/apps/v1/namespaces/analytics/deployments/report-builder"
body_contains = "1Gi"

[[expect.required_calls]]
service = "sentry"
method = "PUT"
path_regex = "(?i)^/api/0/organizations/lumen-labs/issues/(REPORT-BUILDER-4T|6184422318)/$"

[[expect.forbidden_calls]]
service = "kubernetes"
method = "DELETE"

[[expect.forbidden_calls]]
service = "kubernetes"
method = "PATCH"
path_regex = "/namespaces/analytics-staging/|/deployments/report-(api|scheduler)"

[[expect.forbidden_calls]]
service = "kubernetes"
method = "PUT"
path_regex = "/namespaces/analytics-staging/|/deployments/report-(api|scheduler)"

[[expect.forbidden_calls]]
service = "sentry"
method = "PUT"
path_regex = "(?i)/issues/(BILLING-EXPORTER-2D|6184421777|REPORT-BUILDER-4Q|6184422290)/$"

[[expect.forbidden_calls]]
service = "sentry"
method = "DELETE"

[[solution.call]]
endpoint = "kubernetes"
tool = "pods_list_in_namespace"
arguments = { namespace = "analytics" }

[[solution.call]]
endpoint = "kubernetes"
tool = "pods_get"
arguments = { namespace = "analytics", name = "report-builder-t2h6vx4p7r-q8j52" }

[[solution.call]]
endpoint = "kubernetes"
tool = "resources_create_or_update"
arguments = { resource = """
apiVersion: apps/v1
kind: Deployment
metadata:
  name: report-builder
  namespace: analytics
spec:
  template:
    spec:
      containers:
        - name: report-builder
          resources:
            limits:
              memory: 1Gi
""" }

[[solution.call]]
endpoint = "sentry"
tool = "search_issues"
arguments = { organizationSlug = "lumen-labs", projectSlugOrId = "report-builder", query = "is:unresolved WorkerLostError" }

[[solution.call]]
endpoint = "sentry"
tool = "update_issue"
arguments = { organizationSlug = "lumen-labs", issueId = "REPORT-BUILDER-4T", status = "resolved" }
