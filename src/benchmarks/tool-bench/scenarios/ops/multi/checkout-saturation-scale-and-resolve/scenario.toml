[scenario]
id = "ops/multi/checkout-saturation-scale-and-resolve"
title = "Scale production checkout per the incident runbook, then note and resolve the page"
now = "2026-10-30T14:00:00Z"
seed = "ops-multi-checkout-saturation-scale-and-resolve"
services = ["pagerduty", "kubernetes"]
tags = ["write", "multi-service", "pagerduty", "kubernetes", "disambiguation"]
timeout_sec = 900

# PagerDuty: two triggered incidents titled "Checkout API saturated: p95 latency above 2s".
# Q7CHKAP15PCT1D (checkout-api, production) says: scale shop-prod/checkout to 9 replicas.
# Q8CHKSTG5PCT2F (checkout-api-staging) says: scale shop-staging/checkout to 3. checkout-web
# has a third, acknowledged incident. Kubernetes: shop-prod/checkout runs 3 replicas;
# checkout-worker (2) must not be scaled; shop-staging/checkout stays at 1.
[[expect.state]]
pointer = "/services/kubernetes/deployments.apps/shop-prod~1checkout/spec/replicas"
equals = 9

[[expect.state]]
pointer = "/services/kubernetes/deployments.apps/shop-prod~1checkout/spec/template/spec/containers/0/image"
equals = "ghcr.io/tidewater/checkout:4.18.2"

[[expect.state]]
pointer = "/services/kubernetes/deployments.apps/shop-prod~1checkout-worker/spec/replicas"
equals = 2

[[expect.state]]
pointer = "/services/kubernetes/deployments.apps/shop-staging~1checkout/spec/replicas"
equals = 1

[[expect.state]]
pointer = "/services/pagerduty/incidents/Q7CHKAP15PCT1D/status"
equals = "resolved"

[[expect.state]]
pointer = "/services/pagerduty/notes"
key_prefix = "Q7CHKAP15PCT1D/"
any = { content = "9" }

[[expect.state]]
pointer = "/services/pagerduty/incidents/Q8CHKSTG5PCT2F/status"
equals = "triggered"

[[expect.state]]
pointer = "/services/pagerduty/incidents/Q9CHKWEB5XX3VK/status"
equals = "acknowledged"

[[expect.state]]
pointer = "/services/pagerduty/notes/Q8CHKSTG5PCT2F~11"
exists = false

[[expect.required_calls]]
service = "kubernetes"
path_regex = "^/apis/apps/v1/namespaces/shop-prod/deployments/checkout(/scale)?$"
body = { spec = { replicas = 9 } }

[[expect.required_calls]]
service = "pagerduty"
method = "POST"
path = "/incidents/Q7CHKAP15PCT1D/notes"

[[expect.required_calls]]
service = "pagerduty"
method = "PUT"
path = "/incidents"
body = { incidents = [{ id = "Q7CHKAP15PCT1D", status = "resolved" }] }

[[expect.forbidden_calls]]
service = "kubernetes"
method = "DELETE"

[[expect.forbidden_calls]]
service = "kubernetes"
path_regex = "/namespaces/shop-staging/"
method = "PUT"

[[expect.forbidden_calls]]
service = "kubernetes"
path_regex = "/namespaces/shop-staging/"
method = "PATCH"

[[expect.forbidden_calls]]
service = "pagerduty"
method = "PUT"
path = "/incidents"
body = { incidents = [{ id = "Q8CHKSTG5PCT2F" }] }

[[expect.forbidden_calls]]
service = "pagerduty"
method = "PUT"
path = "/incidents"
body = { incidents = [{ id = "Q9CHKWEB5XX3VK" }] }

[[solution.call]]
endpoint = "pagerduty"
tool = "list_incidents"
arguments = { statuses = ["triggered", "acknowledged"] }

[[solution.call]]
endpoint = "pagerduty"
tool = "get_incident"
arguments = { incident_id = "Q7CHKAP15PCT1D" }

[[solution.call]]
endpoint = "kubernetes"
tool = "resources_list"
arguments = { apiVersion = "apps/v1", kind = "Deployment", namespace = "shop-prod" }

[[solution.call]]
endpoint = "kubernetes"
tool = "resources_scale"
arguments = { apiVersion = "apps/v1", kind = "Deployment", namespace = "shop-prod", name = "checkout", scale = 9 }

[[solution.call]]
endpoint = "pagerduty"
tool = "add_note_to_incident"
arguments = { incident_id = "Q7CHKAP15PCT1D", note = "Per RB-CHK-07: scaled the checkout Deployment in shop-prod from 3 to 9 replicas." }

[[solution.call]]
endpoint = "pagerduty"
tool = "manage_incidents"
arguments = { manage_request = { incident_ids = ["Q7CHKAP15PCT1D"], status = "resolved" } }
